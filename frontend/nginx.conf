server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location ~* "^/(assets|canvaskit)/.+\.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|gif|svg|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
